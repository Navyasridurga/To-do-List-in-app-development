kind = "mobile"
previewPath = "/"
title = "Calm Companion"
version = "1.0.0"
id = "artifacts/calm-companion"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 26252

[services.development]
run = "pnpm --filter @workspace/calm-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/calm-companion", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/calm-companion", "run", "serve" ]

[services.env]
PORT = "26252"
BASE_PATH = "/"
